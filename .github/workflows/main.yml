name: Build Kernel - gts210ltexx (universal5433)

on:
  push:
    branches: [ "lineage-18.1", "main", "master" ]
  pull_request:
    branches: [ "lineage-18.1", "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04          # ← This fixes the seqlock/dep_map error

    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          max-size: 2G
          key: ${{ runner.os }}-ccache-gts210ltexx

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libssl-dev \
            wget \
            xz-utils

      - name: Download toolchain (arter97/arm-linux-androideabi-4.9)
        run: |
          git clone --depth=1 https://github.com/arter97/arm-linux-androideabi-4.9.git toolchain
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Build kernel (gts210ltexx)
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-androideabi-
          export CC="ccache arm-linux-androideabi-gcc"
          export CXX="ccache arm-linux-androideabi-g++"

          mkdir -p out

          # Generate .config from defconfig
          make O=out ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} lineage_gts210ltexx_defconfig

          # Build (produces zImage + Image)
          make O=out ARCH=arm CROSS_COMPILE=${CROSS_COMPILE} CC="${CC}" -j$(nproc)
          
          ls -lh out/arch/arm/boot/ out/.config

      - name: Show ccache stats
        run: ccache -s

      - name: Upload kernel + config
        uses: actions/upload-artifact@v4
        with:
          name: gts210ltexx-kernel
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/Image
            out/.config
            out/System.map
            out/vmlinux
          if-no-files-found: error
          retention-days: 30
