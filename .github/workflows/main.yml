name: Build Kernel - (universal5433)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:20.04          # ← This fixes the seqlock/dep_map error
    
    strategy:
      fail-fast: false               # Prevents one failing device from stopping the other
      matrix:
        device: [gts210wifi, gts210ltexx]

    steps:
      - name: Install Git
        run: |
          apt-get update && apt-get install -y git
      
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Install build dependencies
        run: |
          apt-get update -qq
          apt-get install -y \
            bc \
            bison \
            build-essential \
            ccache \
            flex \
            git \
            libssl-dev \
            wget \
            xz-utils

      - name: Download toolchain (OpenCentauri/arm-linux-gnueabihf-gcc)
        run: |
          git clone --depth=1 https://github.com/OpenCentauri/arm-linux-gnueabihf-gcc.git toolchain
          echo "$(pwd)/toolchain/bin" >> $GITHUB_PATH

      - name: Build kernel
        run: |
          export ARCH=arm
          export CROSS_COMPILE=arm-linux-gnueabihf-

          mkdir -p out

          # Generate .config using the current matrix device context
          make O=out lineage_${{ matrix.device }}_defconfig
          cp "$(find . -name .config -print -quit)" out/config

          # Build (produces zImage + Image)
          make O=out -j$(nproc)
          
          ls -lh out/arch/arm/boot/ out/.config

      - name: Show ccache stats
        run: ccache -s

      - name: Upload kernel + config
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.device }}-kernel
          path: |
            out/arch/arm/boot/zImage
            out/arch/arm/boot/Image
            out/config
            out/System.map
            out/vmlinux
          if-no-files-found: error
          retention-days: 30
